<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NullSec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#c8ccd0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden}
.auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.auth-screen h1{font-size:42px;font-weight:900;color:#00ff88;text-shadow:0 0 20px rgba(0,255,136,.3)}
.auth-screen p{color:#555;font-size:13px;margin-bottom:10px}
.auth-screen input{background:#14141f;border:1px solid #2a2a3a;padding:12px 20px;border-radius:8px;color:#fff;font-size:15px;width:280px;outline:none}
.auth-screen input:focus{border-color:#00ff88}
.auth-screen .btn{background:linear-gradient(135deg,#00cc6a,#00ff88);border:none;padding:12px 40px;border-radius:8px;color:#000;font-weight:700;font-size:14px;cursor:pointer;width:280px}
.auth-screen .btn-secondary{background:#1a1a2a;border:1px solid #2a2a3a;color:#888}
.auth-screen .btn-secondary:hover{border-color:#00ff88;color:#00ff88}
.auth-screen .error{color:#ff4444;font-size:12px;min-height:18px}
.auth-screen .tabs{display:flex;gap:0;margin-bottom:10px}
.auth-screen .tab{padding:10px 24px;background:#14141f;border:1px solid #2a2a3a;color:#666;cursor:pointer;font-size:13px;font-weight:600}
.auth-screen .tab:first-child{border-radius:8px 0 0 8px}
.auth-screen .tab:last-child{border-radius:0 8px 8px 0}
.auth-screen .tab.active{background:#1a2a1f;border-color:#00ff88;color:#00ff88}
.app{display:none;height:100vh;grid-template-columns:220px 1fr 200px;grid-template-rows:50px 1fr}
.app.active{display:grid}
.header{grid-column:1/-1;background:#0d0d14;border-bottom:1px solid #1a1a2a;display:flex;align-items:center;padding:0 20px;gap:12px}
.header h1{font-size:16px;color:#00ff88;font-weight:800}
.header .channel-name{color:#666;font-size:13px;margin-left:8px}
.header .user-info{margin-left:auto;font-size:12px;color:#555}
.header .user-info span{color:#00ff88}
.sidebar{background:#0d0d14;border-right:1px solid #1a1a2a;padding:12px;overflow-y:auto}
.sidebar h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#444;margin:16px 0 8px}
.channel-btn{display:block;width:100%;padding:8px 12px;background:transparent;border:none;color:#888;font-size:13px;text-align:left;border-radius:6px;cursor:pointer;margin:2px 0}
.channel-btn:hover{background:#1a1a2a;color:#ccc}
.channel-btn.active{background:#1a2a1f;color:#00ff88}
.chat-area{display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px;padding:6px 0}
.msg-avatar{width:36px;height:36px;border-radius:50%;background:#1a1a2a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.msg-content{flex:1}
.msg-header{display:flex;align-items:baseline;gap:8px}
.msg-name{font-weight:700;font-size:13px}
.msg-time{font-size:10px;color:#444}
.msg-text{font-size:14px;color:#ddd;margin-top:3px;word-break:break-word}
.msg-img{max-width:300px;max-height:200px;border-radius:8px;margin-top:6px;cursor:pointer}
.msg-system{color:#555;font-size:12px;font-style:italic;padding:4px 0}
.input-area{padding:12px 16px;border-top:1px solid #1a1a2a;display:flex;gap:8px;align-items:center}
.input-area input[type=text]{flex:1;background:#14141f;border:1px solid #2a2a3a;padding:10px 14px;border-radius:8px;color:#fff;font-size:14px;outline:none}
.input-area input[type=text]:focus{border-color:#00ff88}
.input-area label{cursor:pointer;padding:8px;border-radius:6px;background:#1a1a2a;color:#666;font-size:18px}
.input-area label:hover{background:#2a2a3a;color:#00ff88}
.input-area input[type=file]{display:none}
.input-area button{background:#00ff88;border:none;padding:10px 16px;border-radius:8px;color:#000;font-weight:700;cursor:pointer}
.users-panel{background:#0d0d14;border-left:1px solid #1a1a2a;padding:12px}
.users-panel h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#444;margin-bottom:10px}
.user-item{padding:6px 8px;font-size:12px;color:#888;border-radius:4px}
.user-item::before{content:"●";color:#00ff88;margin-right:6px;font-size:8px}
.typing-indicator{font-size:11px;color:#555;padding:4px 16px;height:20px}
@media(max-width:768px){
    .app.active{grid-template-columns:1fr;grid-template-rows:50px 1fr}
    .sidebar,.users-panel{display:none}
}
</style>
</head>
<body>
<div class="auth-screen" id="auth">
    <h1>NullSec</h1>
    <p>encrypted communications</p>
    <div class="tabs">
        <div class="tab active" onclick="switchAuthTab('login')">Login</div>
        <div class="tab" onclick="switchAuthTab('register')">Register</div>
    </div>
    <input type="text" id="auth-username" placeholder="Username" maxlength="20" autocomplete="off">
    <input type="password" id="auth-password" placeholder="Password" maxlength="50" autocomplete="off">
    <div class="error" id="auth-error"></div>
    <button class="btn" id="auth-btn" onclick="doAuth()">Login</button>
</div>

<div class="app" id="app">
    <div class="header">
        <h1>NullSec</h1>
        <span class="channel-name" id="header-channel"># general</span>
        <div class="user-info">Logged in as <span id="header-user">-</span></div>
    </div>
    <div class="sidebar">
        <h3>Channels</h3>
        <div id="channel-list"></div>
        <h3>Online</h3>
        <div id="sidebar-users"></div>
    </div>
    <div class="chat-area">
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typing"></div>
        <div class="input-area">
            <label for="img-input">📎</label>
            <input type="file" id="img-input" accept="image/*">
            <input type="text" id="msg-input" placeholder="Message #general..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div class="users-panel">
        <h3>Online</h3>
        <div id="users-list"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = '';
let authMode = 'login';

function switchAuthTab(mode) {
    authMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab')[mode === 'login' ? 0 : 1].classList.add('active');
    document.getElementById('auth-btn').textContent = mode === 'login' ? 'Login' : 'Register';
    document.getElementById('auth-error').textContent = '';
}

async function doAuth() {
    const user = document.getElementById('auth-username').value.trim();
    const pass = document.getElementById('auth-password').value;
    const errorEl = document.getElementById('auth-error');
    errorEl.textContent = '';

    if (!user || !pass) { errorEl.textContent = 'Fill in both fields'; return; }

    try {
        const res = await fetch('/' + authMode, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (data.error) { errorEl.textContent = data.error; return; }

        username = data.username;
        localStorage.setItem('nullsec_user', user);
        localStorage.setItem('nullsec_pass', pass);

        document.getElementById('auth').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('header-user').textContent = username;
        socket.emit('join', { username });
    } catch (e) {
        errorEl.textContent = 'Connection error';
    }
}

// Auto-login if saved
window.addEventListener('load', async () => {
    const savedUser = localStorage.getItem('nullsec_user');
    const savedPass = localStorage.getItem('nullsec_pass');
    if (savedUser && savedPass) {
        document.getElementById('auth-username').value = savedUser;
        document.getElementById('auth-password').value = savedPass;
        await doAuth();
    }
});

document.getElementById('auth-username').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });
document.getElementById('auth-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAuth(); });

let currentChannel = 'general';

socket.on('init', (data) => {
    renderChannels(data.channels);
    renderMessages(data.messages);
    renderUsers(data.users);
    currentChannel = data.channel;
});

socket.on('message', (msg) => {
    appendMessage(msg);
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
});

socket.on('system', (text) => {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg-system';
    el.textContent = text;
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
});

socket.on('channelHistory', (data) => {
    currentChannel = data.channel;
    document.getElementById('header-channel').textContent = '# ' + data.channel;
    document.getElementById('msg-input').placeholder = 'Message #' + data.channel + '...';
    document.getElementById('messages').innerHTML = '';
    renderMessages(data.messages);
    document.querySelectorAll('.channel-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.channel === data.channel);
    });
});

socket.on('userlist', (users) => { renderUsers(users); });

socket.on('typing', (user) => {
    const el = document.getElementById('typing');
    el.textContent = user + ' is typing...';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => { el.textContent = ''; }, 2000);
});

function renderChannels(channels) {
    const el = document.getElementById('channel-list');
    el.innerHTML = '';
    channels.forEach(ch => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn' + (ch === currentChannel ? ' active' : '');
        btn.textContent = '# ' + ch;
        btn.dataset.channel = ch;
        btn.onclick = () => { socket.emit('switchChannel', ch); };
        el.appendChild(btn);
    });
}

function renderMessages(messages) {
    messages.forEach(msg => appendMessage(msg));
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
}

function renderUsers(users) {
    const html = users.map(u => `<div class="user-item">${u}</div>`).join('');
    document.getElementById('users-list').innerHTML = html;
    document.getElementById('sidebar-users').innerHTML = html;
}

function appendMessage(msg) {
    const msgs = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = 'msg';
    const initial = msg.username[0].toUpperCase();
    let content = '';
    if (msg.text) content += `<div class="msg-text">${escapeHtml(msg.text)}</div>`;
    if (msg.image) content += `<img class="msg-img" src="${msg.image}" onclick="window.open(this.src)">`;
    const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    el.innerHTML = `
        <div class="msg-avatar" style="color:${msg.color}">${initial}</div>
        <div class="msg-content">
            <div class="msg-header">
                <span class="msg-name" style="color:${msg.color}">${escapeHtml(msg.username)}</span>
                <span class="msg-time">${time}</span>
            </div>
            ${content}
        </div>
    `;
    msgs.appendChild(el);
}

function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('message', { text });
    input.value = '';
}

document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
    else socket.emit('typing');
});

document.getElementById('img-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('image', file);
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.url) socket.emit('message', { text: '', image: data.url });
    e.target.value = '';
});

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>
</body>
</html>
